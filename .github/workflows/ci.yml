name: CI/CD Production Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
    - name: Check out Repository Code
      uses: actions/checkout@v3

    - name: Set up Python 3.11 Runtime
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install httpx  # Required utility for FastAPI TestClient

    - name: Run Automated Unit Tests (PyTest)
      run: |
        # PYTHONPATH=. explicitly tells Python to include the root folder in its search path
        PYTHONPATH=. pytest

  build-container:
    needs: test-and-verify
    runs-on: ubuntu-latest
    steps:
    - name: Check out Repository Code
      uses: actions/checkout@v3

    - name: Verify Docker Production Build Capability
      run: |
        docker build -t fraud-app:latest .